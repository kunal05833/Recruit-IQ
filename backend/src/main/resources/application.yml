# ═══════════════════════════════════════════════════════════════════════
#  AI Recruitment Platform — Application Configuration
#  All secrets must be provided via environment variables (.env file or Docker)
# ═══════════════════════════════════════════════════════════════════════
server:
  port: ${PORT:8080}
spring:
  application:
    name: ai-recruitment-platform

  # ── Database ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ───────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  # ── File Upload ───────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Email ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

  # ── Task Execution ────────────────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100

# ── JWT ───────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}         # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

# ── AI / OpenAI / Groq ────────────────────────────────────────────────────
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: ${OPENAI_API_URL:https://api.groq.com/openai/v1}

# ── Resume Storage ────────────────────────────────────────────────────────
resume:
  upload:
    dir: ${RESUME_UPLOAD_DIR:uploads/resumes}
    max-size-mb: 10
    allowed-types: application/pdf

# ── Application Feature Flags ─────────────────────────────────────────────
app:
  email:
    enabled: ${EMAIL_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Notification Scheduler ────────────────────────────────────────────────
notification:
  job-match-check-ms: ${JOB_MATCH_CHECK_MS:21600000}   # 6 hours

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: AI Recruitment Platform API
    version: 1.0.0

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.example.ai_recruitment_platform: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/ai-recruitment.log}
    max-size: 10MB
    max-history: 30

# ── Actuator (for health checks in Docker/K8s) ────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
