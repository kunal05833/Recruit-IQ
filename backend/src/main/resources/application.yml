# ═══════════════════════════════════════════════════════════════════════
# AI Recruitment Platform — Production Ready Configuration
# Compatible with:
# - Render
# - Aiven MySQL
# - Spring Boot
# ═══════════════════════════════════════════════════════════════════════

server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-recruitment-platform

  # ───────────────── DATABASE ─────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ───────────────── JPA / HIBERNATE ─────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${SHOW_SQL:false}

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  # ───────────────── FILE UPLOAD ─────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ───────────────── MAIL ─────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

  # ───────────────── TASK EXECUTION ─────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100

# ───────────────── JWT ─────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ───────────────── AI CONFIG ─────────────────
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: ${OPENAI_API_URL:https://api.groq.com/openai/v1}

# ───────────────── RESUME STORAGE ─────────────────
resume:
  upload:
    dir: ${RESUME_UPLOAD_DIR:uploads/resumes}
    max-size-mb: 10
    allowed-types: application/pdf

# ───────────────── APP SETTINGS ─────────────────
app:
  email:
    enabled: ${EMAIL_ENABLED:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ───────────────── NOTIFICATIONS ─────────────────
notification:
  job-match-check-ms: ${JOB_MATCH_CHECK_MS:21600000}

# ───────────────── SWAGGER ─────────────────
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ───────────────── LOGGING ─────────────────
logging:
  level:
    com.example.ai_recruitment_platform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ───────────────── ACTUATOR ─────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized